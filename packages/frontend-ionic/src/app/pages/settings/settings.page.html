<app-header title="Settings"></app-header>

<ion-content color="light" class="ion-padding">
  <ion-list [inset]="true">
    <!-- Language Settings -->
    <ion-item>
      <ion-label>Show English Content</ion-label>
      <ion-toggle
        slot="end"
        [checked]="settings.useEnglish"
        (ionChange)="toggleSetting('useEnglish')"
      ></ion-toggle>
    </ion-item>

    <!-- Scientific Names -->
    <ion-item>
      <ion-label>Show Scientific Names</ion-label>
      <ion-toggle
        slot="end"
        [(ngModel)]="settings.showScientificNames"
        (ionChange)="toggleSetting('showScientificNames')"
      ></ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()" class="px-4">
        <ion-icon slot="icon-only" name="close" class="text-2xl"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="applySettings()" class="px-4">
        <ion-icon slot="icon-only" name="checkmark-circle" class="text-2xl"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
