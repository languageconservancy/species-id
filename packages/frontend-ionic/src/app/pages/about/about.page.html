<app-header title="About"></app-header>

<ion-content class="ion-padding">
  <div class="flex flex-col items-center justify-center h-full">
    <h1 class="text-2xl font-bold mb-4">{{ env.mainMenuLabel }}</h1>
    <p class="text-center mb-4">
      A comprehensive guide to birds and plants found in the Crow Country, in the Crow language.
    </p>
    <p class="text-center mb-4">
      This application helps users identify and learn about local birds and plants, with names and
      descriptions in both Crow and English.
    </p>
    <p class="text-center text-sm text-gray-500">Version 1.0.0</p>
  </div>
  <app-back-button [addBottomSafePadding]="false"></app-back-button>
</ion-content>
