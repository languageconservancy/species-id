<ion-content class="ion-padding">
  <div class="flex flex-col items-center justify-center h-full gap-8">
    <div class="text-center">
      <h1 class="text-4xl font-bold mb-4 font-localNames">{{ mainMenuLabel }}</h1>
      <p class="text-lg mb-8">
        A comprehensive guide to birds and plants found in the Crow Reservation, in the Crow
        language.
      </p>
    </div>

    <div class="flex flex-col gap-4 w-full max-w-md">
      <ion-button expand="block" (click)="navigateToExplore(SpeciesType.Bird)" color="primary">
        <ion-icon slot="start" name="bird"></ion-icon>
        Explore Birds
      </ion-button>

      <ion-button expand="block" (click)="navigateToExplore(SpeciesType.Plant)" color="secondary">
        <ion-icon slot="start" name="leaf"></ion-icon>
        Explore Plants
      </ion-button>
    </div>

    <p class="text-sm text-gray-500 mt-8">Version 1.0.0</p>
  </div>
</ion-content>
