<ion-item class="ion-activatable ripple-parent" (click)="onItemClick(item)">
  @if (item.images && item.images.length > 0) {
    <div class="rounded-md w-24 aspect-[4/3] overflow-hidden">
      <ion-img
        class="object-cover w-full h-full"
        [src]="speciesService.getImageUrl(item.images[0].fileName)"
      ></ion-img>
    </div>
  }
  <ion-label class="ml-4">
    <h2 class="font-localNames text-lg">{{ item.nameLocal }}</h2>
    <p class="font-medium">{{ item.nameEn }}</p>
    <p>
      <i>{{ item.nameScientific }}</i>
    </p>
    <!-- Type-specific content will be projected here -->
    <ng-content select="[typeSpecific]"></ng-content>
  </ion-label>
  <!-- Type-specific actions will be projected here -->
  <ng-content select="[typeActions]"></ng-content>
  <ion-icon slot="end" name="chevron-forward"></ion-icon>
</ion-item>
