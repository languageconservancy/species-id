<ion-menu menu-id="main-menu" contentId="main-content" side="start" type="overlay" color="primary">
  <ion-content class="ion-padding" color="primary">
    <div class="flex flex-col w-full h-full justify-end items-start pb-28">
      <ion-list lines="inset" color="primary">
        <ion-list-header class="pb-4" color="primary">
          <ion-label class="ion-text-center text-wrap font-localNames text-4xl font-bold">{{
            configService.get('mainMenuLabel')
          }}</ion-label>
        </ion-list-header>

        @for (item of menuItems; track item; let index = $index) {
          <ion-item button (click)="menuItemClicked(item.link)" color="primary">
            <ion-icon slot="start" [name]="item.icon"></ion-icon>
            <h2 class="font-localNames text-2xl font-bold py-2">{{ item.label }}</h2>
          </ion-item>
        }
        <ion-item button (click)="openSettingsModal()" color="primary">
          <ion-icon slot="start" name="settings"></ion-icon>
          <h2 class="font-localNames text-2xl font-bold py-2">Settings</h2>
        </ion-item>
      </ion-list>
      <!-- X close button -->
      <ion-fab vertical="bottom" horizontal="center" slot="fixed" class="bottom-safe">
        <ion-fab-button (click)="closeMenu()" color="primary">
          <ion-icon name="close" color="light"></ion-icon>
        </ion-fab-button>
      </ion-fab>
    </div>
  </ion-content>
</ion-menu>
