<!-- Search bar, sitting outside ion-content so it doesn't scroll with the content -->

<ion-footer class="bg-primary border-b-[1px] border-gray-200">
  <div class="position-fixed bottom-[56px] flex flow-row flex-nowrap items-center justify-between">
    <ion-searchbar
      #searchBar
      [debounce]="500"
      placeholder="Search..."
      (ionInput)="searchChanged($event)"
      show-clear-button="always"
      color="light"
    ></ion-searchbar>
    <ion-icon
      [name]="isRecording ? 'stop' : 'mic'"
      size="large"
      color="light"
      class="cursor-pointer pr-2"
      (click)="toggleRecording()"
    ></ion-icon>
    <ion-icon
      name="options"
      size="large"
      class="cursor-pointer pr-2"
      (click)="openOptionsModal()"
      color="light"
    ></ion-icon>
  </div>
</ion-footer>
