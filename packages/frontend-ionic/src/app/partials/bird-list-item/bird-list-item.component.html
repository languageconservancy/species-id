<ion-item
  class="ion-activatable ripple-parent"
  [lines]="isLastItem ? 'none' : 'inset'"
  (click)="onItemClick(item)"
>
  @if (item.images && item.images.length > 0) {
    <div class="rounded-md w-24 aspect-[4/3] overflow-hidden flex-shrink-0 my-3">
      <ion-img
        class="object-cover w-full h-full"
        [src]="speciesService.getImageUrl(item.images[0].fileName)"
      ></ion-img>
    </div>
  }
  <div class="ml-4">
    <div class="font-localNames text-xl">{{ item.nameLocal }}</div>
    @if (settings.useEnglish) {
      <div class="font-medium text-gray-500 text-base">{{ item.nameEn }}</div>
    }
    @if (settings.showScientificNames) {
      <div class="text-base italic text-gray-500">{{ item.nameScientific }}</div>
    }
    <!-- Type-specific content will be projected here -->
    <ng-content select="[typeSpecific]"></ng-content>
  </div>
  <!-- Type-specific actions will be projected here -->
  <ng-content select="[typeActions]"></ng-content>
  <ion-icon slot="end" name="chevron-forward"></ion-icon>
</ion-item>
