<ion-tabs>
  @if (enableSearch) {
  <ion-searchbar
    [debounce]="500"
    placeholder="Search..."
    (ionInput)="searchChanged($event)"
    show-clear-button="always"
  ></ion-searchbar>
  }
  <ion-tab-bar slot="bottom">
    <ion-tab-button (click)="openMenu()">
      <ion-icon aria-hidden="true" name="menu"></ion-icon>
    </ion-tab-button>
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="search"></ion-icon>
      <ion-label>Chichíinnee</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
