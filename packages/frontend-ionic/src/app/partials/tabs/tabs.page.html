<ion-tabs color="primary">
  <ion-tab-bar slot="bottom" color="primary" class="pt-2">
    <ion-tab-button (click)="openMenu()">
      <ion-icon aria-hidden="true" color="light" name="menu"></ion-icon>
    </ion-tab-button>
    <ion-tab-button
      tab="tab1"
      [routerLink]="['/tabs/tab1', currentDomain === speciesType.Bird ? 'birds' : 'plants']"
    >
      <ion-icon aria-hidden="true" color="light" [name]="exploreIcon"></ion-icon>
      <ion-label class="text-sm font-localNames" color="light">Chichíinnee</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
