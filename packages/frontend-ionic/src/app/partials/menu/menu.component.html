<ion-menu menu-id="main-menu" contentId="main-content" side="start" type="overlay">
  <ion-content class="ion-padding">
    <div class="flex flex-col w-full h-full justify-center items-start pb-safe">
      <ion-list lines="inset">
        <ion-list-header class="mb-4">
          <ion-label class="ion-text-center text-wrap">{{ env.mainMenuLabel }}</ion-label>
        </ion-list-header>

        @for (item of menuItems; track item; let index = $index) {
          <ion-item button (click)="menuItemClicked(item.link)">
            <ion-icon slot="start" [name]="item.icon"></ion-icon>
            <ion-label class="text-lg"
              ><h2>{{ item.label }}</h2></ion-label
            >
          </ion-item>
        }
      </ion-list>
    </div>
  </ion-content>
</ion-menu>
