<!-- Optional overlay for explore page with filters and sorting options -->
<ion-header>
  <ion-toolbar>
    <ion-title>Options</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" color="light" [fullscreen]="true">
  <ion-label>Sort by</ion-label>
  <ion-list [inset]="true">
    <ion-item
      class="cursor-pointer"
      [class.ion-color]="selectedSort === 'alphabetical-local'"
      [color]="selectedSort === 'alphabetical-local' ? 'primary' : 'light'"
      (click)="selectedSort = 'alphabetical-local'"
    >
      <ion-label>Alphabetical (Crow)</ion-label>
    </ion-item>
    <ion-item
      class="cursor-pointer"
      [class.ion-color]="selectedSort === 'alphabetical-english'"
      [color]="selectedSort === 'alphabetical-english' ? 'primary' : 'light'"
      (click)="selectedSort = 'alphabetical-english'"
    >
      <ion-label>Alphabetical (English)</ion-label>
    </ion-item>
    <ion-item
      class="cursor-pointer"
      [class.ion-color]="selectedSort === 'by-order'"
      [color]="selectedSort === 'by-order' ? 'primary' : 'light'"
      (click)="selectedSort = 'by-order'"
    >
      <ion-label>By order</ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<!-- This is the options component for the Ionic application, allowing users to set preferences for sorting, filtering, and language. -->
<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
        <!-- Close -->
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="applyOptions()">
        <ion-icon slot="icon-only" name="checkmark-circle"></ion-icon>
        <!-- Apply -->
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
