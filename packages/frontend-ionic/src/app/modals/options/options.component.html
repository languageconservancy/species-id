<!-- Optional overlay for explore page with filters and sorting options -->
<app-header title="Options"></app-header>

<ion-content class="ion-padding">
  <ion-label class="ion-text-uppercase" color="medium">Sort by</ion-label>
  <ion-list [inset]="true">
    @for (option of sortOptions; track option.value) {
      <ion-item
        class="cursor-pointer"
        [class.ion-color]="selectedSort === option.value"
        [color]="selectedSort === option.value ? 'secondary' : ''"
        (click)="selectedSort = option.value"
      >
        <ion-label>{{ option.label }}</ion-label>
      </ion-item>
    }
  </ion-list>

  <ion-label class="ion-text-uppercase" color="medium">Filter by</ion-label>
  <ion-list [inset]="true">
    @for (option of filterOptions; track option.value) {
      <ion-item
        class="cursor-pointer"
        [class.ion-color]="selectedFilter === option.value"
        [color]="selectedFilter === option.value ? 'secondary' : ''"
        (click)="selectedFilter = option.value"
      >
        <ion-label>{{ option.label }}</ion-label>
      </ion-item>
    }
  </ion-list>

  <h2 class="ion-text-uppercase text-gray-500">Sort Direction</h2>
  <ion-list [inset]="true">
    @for (option of sortDirectionOptions; track option) {
      <ion-item
        class="cursor-pointer"
        [class.ion-color]="selectedSortDirection === option"
        [color]="selectedSortDirection === option ? 'secondary' : ''"
        (click)="selectedSortDirection = option"
      >
        <ion-label>{{ option | titlecase }}</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>

<!-- This is the options component for the Ionic application, allowing users to set preferences for sorting, filtering, and language. -->
<ion-footer class="safe-pad-bottom">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="close()" class="px-4">
        <ion-icon slot="icon-only" name="close" class="text-2xl"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="resetOptions()" class="px-4">
        <ion-icon slot="icon-only" name="refresh-circle" class="text-2xl"></ion-icon>
      </ion-button>
      <ion-button (click)="applyOptions()" class="px-4">
        <ion-icon slot="icon-only" name="checkmark-circle" class="text-2xl"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
