<ion-menu
  menu-id="main-menu"
  contentId="main-content"
  side="start"
  type="overlay"
  color="primary"
  (ionDidOpen)="onMenuDidOpen()"
>
  <ion-content
    [scrollY]="false"
    class="main-menu-content"
    color="primary"
  >
    <div class="main-menu-layout">
      <!-- App icon: pinned at top so large menu text cannot push it off-screen -->
      <div class="main-menu-brand">
        <img src="assets/core/icon/icon-no-bg.png" alt="App Icon" class="main-menu-brand__icon" />
      </div>
      <div class="main-menu-list-region">
        <div
          #menuListScroll
          class="main-menu-list-scroll"
          (scroll)="updateScrollAffordance()"
        >
        <ion-list lines="inset" color="primary" class="main-menu-list w-full">
          <ion-list-header class="main-menu-list-header" color="primary">
            <ion-label
              class="ion-text-center text-wrap font-menuItems font-bold main-menu-app-title"
              >{{ configService.get('mainMenuLabel') }}</ion-label
            >
          </ion-list-header>

          @for (item of menuItems; track item.link; let index = $index) {
            <ion-item button (click)="menuItemClicked(item.link)" color="primary">
              @if (item.iconUrl) {
                <img [src]="item.iconUrl" alt="" slot="start" class="w-6 h-6 object-contain me-4" />
              } @else {
                <ion-icon slot="start" [name]="item.icon"></ion-icon>
              }
              <h2 class="main-menu-item-label font-menuItems font-bold scaled-text">
                {{ item.label }}
              </h2>
            </ion-item>
          }
          <ion-item button (click)="openSettingsModal()" color="primary">
            <ion-icon slot="start" name="settings"></ion-icon>
            <h2 class="main-menu-item-label font-menuItems font-bold scaled-text">Settings</h2>
          </ion-item>
        </ion-list>
        </div>
        <div
          class="main-menu-scroll-fade"
          [class.main-menu-scroll-fade--hidden]="!showScrollFade"
          aria-hidden="true"
        ></div>
        @if (showScrollHint) {
        <button
          type="button"
          class="main-menu-scroll-hint"
          (click)="scrollMenuToEnd()"
          aria-label="Scroll to more menu items"
        >
          <ion-icon name="chevron-down" aria-hidden="true"></ion-icon>
        </button>
        }
      </div>
      <div class="main-menu-footer">
        <ion-fab-button (click)="closeMenu()" color="light">
          <ion-icon name="close" color="primary"></ion-icon>
        </ion-fab-button>
      </div>
    </div>
  </ion-content>
</ion-menu>
