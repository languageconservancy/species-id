<app-header [title]="'Explore ' + domainLabel"></app-header>

<ion-content [fullscreen]="true" [scrollY]="false" class="safe-pad-bottom explore-ion-content">
  @if (showDismissOverlay) {
  <div
    class="dismiss-keyboard-overlay"
    (click)="onDismissOverlayClick($event)"
    aria-hidden="true"
  ></div>
  }
  <!-- No items found -->
  @if (items.length === 0) {
  <ion-list lines="none">
    <div class="ion-text-center flex items-center justify-center h-32">
      <ion-label>
        @if (itemsLoading) {
        <span class="text-lg lg:text-xl">Loading plants...</span>
        } @else if (itemsAll.length === 0) {
        <span class="text-lg lg:text-xl">No plants found in the database.</span>
        } @else {
        <span class="text-lg lg:text-xl">No plants found. Try a different search.</span>
        }
      </ion-label>
    </div>
  </ion-list>
  } @else {
  <cdk-virtual-scroll-viewport
    autosize
    appendOnly
    class="explore-virtual-scroll"
    [minBufferPx]="200"
    [maxBufferPx]="400"
  >
    <ion-list lines="none">
      <div
        *cdkVirtualFor="let row of exploreFlatRows; trackBy: trackExploreRow"
        class="explore-virtual-row"
      >
        @switch (row.kind) {
          @case ('divider') {
          <app-list-divider [itemGroup]="row.group" [sticky]="false"></app-list-divider>
          }
          @case ('item') {
          <app-plant-list-item
            [item]="row.item"
            [isLastItem]="row.isLastItem"
            [sortType]="sortType"
          ></app-plant-list-item>
          }
        }
      </div>
    </ion-list>
  </cdk-virtual-scroll-viewport>
  }
</ion-content>

<app-search-bar [domain]="speciesType.Plant"></app-search-bar>
