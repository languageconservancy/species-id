<app-header title="About"></app-header>

<ion-content class="ion-padding safe-pad-bottom safe-pad-top">
  <div class="mx-auto flex max-w-2xl flex-col gap-8 pb-8 pt-10 sm:gap-10 sm:pb-10 sm:pt-14">
    <header class="text-center">
      <h1
        class="font-englishTitles text-3xl font-semibold tracking-wide text-gray-900 text-shadow-lg sm:text-4xl md:text-5xl"
      >
        {{ mainMenuLabel }}
      </h1>
    </header>

    <p
      class="text-center text-lg font-medium leading-relaxed text-gray-600 scaled-text sm:text-xl"
    >
      {{ aboutDescription }}
    </p>

    <div class="border-t border-gray-200 pt-8">
      <p class="text-center leading-relaxed text-gray-800 scaled-text sm:text-lg">
        {{ aboutBody }}
      </p>
    </div>

    <section class="border-t border-gray-200 pt-8 text-center">
      <p class="mb-3 text-lg font-semibold text-gray-900 scaled-text">
        {{ creditsAuthor }}
      </p>
      <p class="text-sm leading-relaxed text-gray-600 scaled-text sm:text-base">
        {{ creditsAcknowledgment }}
      </p>
    </section>

    <p class="text-center text-xs text-gray-500 scaled-text">Version {{ appVersion }}</p>
  </div>
</ion-content>
