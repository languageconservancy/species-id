<app-header title="About"></app-header>

  <div class="flex flex-col gap-4 items-center justify-center h-full">
    <h1 class="text-center text-2xl font-bold mb-4 scaled-text sm:text-3xl lg:text-4xl">
      {{ mainMenuLabel }}
    </h1>
    <p class="text-center scaled-text sm:text-lg lg:text-xl">{{ aboutDescription }}</p>
    <p class="text-center mb-4 scaled-text sm:text-lg lg:text-xl">{{ aboutBody }}</p>
    <p class="text-center mt-4 text-sm text-gray-500 scaled-text">Version {{ appVersion }}</p>
  </div>
</ion-content>
